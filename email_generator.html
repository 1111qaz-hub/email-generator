<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp 外贸开发消息生成器</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Microsoft YaHei", sans-serif;
      background: #f5f5f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 20px 10px;
    }
    .container { max-width: 550px; width: 100%; }
    .header {
      background: #25D366;
      color: white;
      padding: 18px 20px;
      border-radius: 14px;
      margin-bottom: 15px;
      text-align: center;
    }
    .header h1 { font-size: 20px; margin-bottom: 4px; }
    .header p { font-size: 12px; opacity: 0.9; }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    .card h2 {
      font-size: 15px;
      margin-bottom: 12px;
      color: #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card h2 .badge {
      font-size: 11px;
      font-weight: normal;
      color: #25D366;
      background: #e6f9ee;
      padding: 3px 8px;
      border-radius: 10px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
      margin-top: 10px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 2px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #25D366;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #25D366;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 15px;
    }
    .btn:active { background: #1db954; }

    .style-selector {
      display: flex;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .style-btn {
      padding: 8px 14px;
      border: 2px solid #ddd;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      background: white;
      color: #555;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .style-btn.active {
      background: #25D366;
      color: white;
      border-color: #25D366;
      font-weight: 600;
    }

    .result-box {
      background: #f0faf3;
      border: 1px solid #d4edda;
      border-radius: 10px;
      padding: 15px;
      font-size: 13px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      min-height: 100px;
      color: #333;
    }

    .copy-btn {
      background: #128C7E;
      margin-top: 8px;
    }
    .copy-btn:active { background: #0e7265; }

    .tip {
      text-align: center;
      font-size: 11px;
      color: #999;
      margin-top: 15px;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>💬 WhatsApp 外贸开发消息生成器</h1>
    <p>填入信息 → 生成口语化消息 → 复制发客户</p>
  </div>

  <div class="card">
    <h2>1. 客户信息 <span class="badge">每条都填</span></h2>

    <label>客户名字（不知道就留空）</label>
    <input type="text" id="contactName" placeholder="例如：Rajesh">

    <label>客户公司名</label>
    <input type="text" id="companyName" placeholder="例如：Green Garden LLC">

    <label>你从哪里找到他的？</label>
    <select id="foundFromSelect" onchange="toggleCustomSource()">
      <option value="LinkedIn">LinkedIn</option>
      <option value="Instagram">Instagram</option>
      <option value="Facebook">Facebook</option>
      <option value="TikTok">TikTok</option>
      <option value="YouTube">YouTube</option>
      <option value="your website">Your website</option>
      <option value="a trade show">A trade show</option>
      <option value="Other">Other</option>
    </select>
    <div id="customSourceWrapper" class="hidden" style="margin-top:8px;">
      <label>请填写具体来源</label>
      <input type="text" id="customSource" placeholder="例如：Google Maps, industry directory...">
    </div>
  </div>

  <div class="card">
    <h2>2. 你的信息 <span class="badge">只填一次，自动保存</span></h2>

    <label>你的名字</label>
    <input type="text" id="yourName" placeholder="输入你的名字">

    <label>你的公司名</label>
    <input type="text" id="yourCompany" placeholder="输入你的公司名">

    <label>你卖什么产品（简短描述）</label>
    <input type="text" id="products" placeholder="例如：LED lights, artificial plants, phone accessories">
  </div>

  <div class="card">
    <h2>3. 消息风格</h2>
    <div class="style-selector" id="styleSelector">
      <button class="style-btn active" data-style="friendly" onclick="selectStyle('friendly')">😊 友好型</button>
      <button class="style-btn" data-style="short" onclick="selectStyle('short')">⚡ 超简短</button>
      <button class="style-btn" data-style="professional" onclick="selectStyle('professional')">💼 专业型</button>
    </div>
  </div>

  <button class="btn" onclick="generateMessage()">🚀 生成 WhatsApp 消息</button>

  <div class="card" id="resultCard" style="display:none;">
    <h2>📱 你的消息</h2>
    <div class="result-box" id="resultBox"></div>
    <button class="btn copy-btn" onclick="copyResult()">📋 一键复制</button>
  </div>

  <div class="tip">免费版固定模板 · 需要个性化定制请联系客服</div>
</div>

<script>
let currentStyle = 'friendly';

function toggleCustomSource() {
  const select = document.getElementById('foundFromSelect');
  const customWrapper = document.getElementById('customSourceWrapper');
  if (select.value === 'Other') {
    customWrapper.classList.remove('hidden');
  } else {
    customWrapper.classList.add('hidden');
  }
}

function selectStyle(style) {
  currentStyle = style;
  document.querySelectorAll('.style-btn').forEach(btn => {
    btn.classList.remove('active');
    if (btn.dataset.style === style) {
      btn.classList.add('active');
    }
  });
}

function savePersonalInfo() {
  const personalInfo = {
    yourName: document.getElementById('yourName').value.trim(),
    yourCompany: document.getElementById('yourCompany').value.trim(),
    products: document.getElementById('products').value.trim()
  };
  localStorage.setItem('whatsapp_generator_personal_info', JSON.stringify(personalInfo));
}

function loadPersonalInfo() {
  const saved = localStorage.getItem('whatsapp_generator_personal_info');
  if (saved) {
    try {
      const info = JSON.parse(saved);
      document.getElementById('yourName').value = info.yourName || '';
      document.getElementById('yourCompany').value = info.yourCompany || '';
      document.getElementById('products').value = info.products || '';
    } catch(e) {
      console.log('读取保存信息失败');
    }
  }
}

document.addEventListener('DOMContentLoaded', function() {
  loadPersonalInfo();
  const personalInputs = ['yourName', 'yourCompany', 'products'];
  personalInputs.forEach(id => {
    document.getElementById(id).addEventListener('input', savePersonalInfo);
  });
});

function generateMessage() {
  const contactName = document.getElementById('contactName').value.trim();
  const companyName = document.getElementById('companyName').value.trim() || '[客户公司名]';
  const yourName = document.getElementById('yourName').value.trim() || '[你的名字]';
  const yourCompany = document.getElementById('yourCompany').value.trim() || '[你的公司名]';
  const products = document.getElementById('products').value.trim() || '[你卖的产品]';

  const sourceSelect = document.getElementById('foundFromSelect');
  let foundFrom = sourceSelect.value;
  if (foundFrom === 'Other') {
    foundFrom = document.getElementById('customSource').value.trim() || 'other sources';
  }

  savePersonalInfo();

  let message = '';

  if (currentStyle === 'friendly') {
    message = generateFriendlyMessage(contactName, companyName, yourName, yourCompany, products, foundFrom);
  } else if (currentStyle === 'short') {
    message = generateShortMessage(contactName, companyName, yourName, yourCompany, products, foundFrom);
  } else {
    message = generateProfessionalMessage(contactName, companyName, yourName, yourCompany, products, foundFrom);
  }

  document.getElementById('resultBox').textContent = message;
  document.getElementById('resultCard').style.display = 'block';
  document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth' });
}

function generateFriendlyMessage(contactName, companyName, yourName, yourCompany, products, foundFrom) {
  let opening;
  if (contactName) {
    opening = `Hi ${contactName} 👋`;
  } else {
    opening = `Hi ${companyName} team 👋`;
  }

  return `${opening}

I'm ${yourName} from ${yourCompany} in China. We specialize in ${products}.

Came across ${companyName} on ${foundFrom} — thought there might be a good fit between us.

Our prices are competitive, and we can handle everything from samples to bulk orders.

Would you be interested in taking a quick look at what we offer? I can send you some photos and pricing 😊`;
}

function generateShortMessage(contactName, companyName, yourName, yourCompany, products, foundFrom) {
  let opening;
  if (contactName) {
    opening = `Hey ${contactName}`;
  } else {
    opening = `Hey ${companyName} team`;
  }

  return `${opening},

I'm ${yourName} from ${yourCompany} (China). We supply ${products}.

Saw you on ${foundFrom}. Interested in a quick look at our products and prices?`;
}

function generateProfessionalMessage(contactName, companyName, yourName, yourCompany, products, foundFrom) {
  let opening;
  if (contactName) {
    opening = `Hello ${contactName},`;
  } else {
    opening = `Hello ${companyName} team,`;
  }

  return `${opening}

This is ${yourName} from ${yourCompany}, based in China. We are a professional supplier of ${products}.

We came across ${companyName} through ${foundFrom} and believe there is strong potential for cooperation between our companies.

We offer stable supply, competitive pricing, and reliable export service. We would be glad to share our product catalogue and discuss how we can support your business needs.

Please feel free to reach out if you have any questions.

Best regards,
${yourName}
${yourCompany}`;
}

function copyResult() {
  const text = document.getElementById('resultBox').textContent;
  navigator.clipboard.writeText(text).then(() => {
    alert('✅ 已复制，去 WhatsApp 粘贴发送吧');
  }).catch(() => {
    const area = document.createElement('textarea');
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand('copy');
    document.body.removeChild(area);
    alert('✅ 已复制');
  });
}
</script>
</body>
</html>
